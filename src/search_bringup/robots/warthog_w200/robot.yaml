# Warthog W200 Hotel simulation: Hokuyo 2D LiDAR and RealSense RGB-D.
serial_number: w200-0000
version: 0
system:
  hosts:
  - hostname: cpr-w200-0000
    ip: 192.168.131.1
  ros2:
    namespace: w200_0000
sensors:
  camera:
  - model: intel_realsense
    urdf_enabled: true
    launch_enabled: true
    parent: default_mount
    xyz:
    - 0.4
    - 0.0
    - 0.12
    rpy:
    - 0.0
    - 0.0
    - 0.0
    ros_parameters:
      # Jazzy clearpath_config keys (the Humble-era camera.* names are ignored).
      intel_realsense:
        camera_name: camera_0
        device_type: d435
        serial_no: "0"
        enable_color: true
        # 424x240 at 6 Hz: enough for Nav2 obstacle detection on three robots.
        rgb_camera.color_profile: 424,240,6
        enable_depth: true
        depth_module.depth_profile: 424,240,6
        pointcloud.enable: true
  lidar2d:
  - model: hokuyo_ust
    urdf_enabled: true
    launch_enabled: true
    parent: default_mount
    xyz:
    - 0.0
    - 0.0
    - 0.25
    rpy:
    - 0.0
    - 0.0
    - 0.0
    ros_parameters:
      urg_node:
        laser_frame_id: lidar2d_0_laser
        ip_address: 192.168.131.20
        ip_port: 10940
        angle_min: -3.141592653589793
        angle_max: 3.141592653589793
