# Husky A200 simulation configuration.
# Based on the Clearpath ROS 2 Humble a200_sample.yaml distributed with
# clearpath_config 1.3.3 (BSD-3-Clause).

serial_number: a200-0000
version: 0

system:
  hosts:
    - hostname: cpr-a200-0000
      ip: 192.168.131.1
  ros2:
    namespace: a200_0000

platform:
  attachments:
    - name: front_bumper
      type: a200.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a200.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a200.top_plate
      model: pacs
    - name: sensor_arch
      type: a200.sensor_arch
      parent: default_mount
      model: sensor_arch_300
      enabled: true

links:
  box:
    - name: user_bay_cover
      parent: default_mount
      xyz: [0.0, 0.0, 0.0075]
      rpy: [0.0, 0.0, 0.0]
      size: [0.4, 0.4, 0.002]

mounts:
  bracket:
    - parent: top_plate_mount_d1
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      model: horizontal
  fath_pivot:
    - parent: sensor_arch_mount
      xyz: [0.0, 0.0, -0.021]
      rpy: [3.1415, 0.0, 0.0]
      angle: 0.0

sensors:
  camera:
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      parent: fath_pivot_0_mount
      xyz: [0.0, 0.0, 0.0]
      # Cancel the FATH pivot's 180-degree roll so the image is upright.
      rpy: [3.1415, 0.0, 0.0]
      ros_parameters:
        # Jazzy clearpath_config keys (the Humble-era camera.* names are ignored).
        intel_realsense:
          camera_name: camera_0
          device_type: d435
          serial_no: "0"
          enable_color: true
          # 424x240 at 6 Hz: enough for Nav2 obstacle detection on three robots.
          rgb_camera.color_profile: 424,240,6
          enable_depth: true
          depth_module.depth_profile: 424,240,6
          pointcloud.enable: true
  lidar2d:
    - model: hokuyo_ust
      urdf_enabled: true
      launch_enabled: true
      parent: bracket_0_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        urg_node:
          laser_frame_id: lidar2d_0_laser
          ip_address: 192.168.131.20
          ip_port: 10940
          angle_min: -3.141592653589793
          angle_max: 3.141592653589793
