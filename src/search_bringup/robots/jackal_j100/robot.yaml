# Jackal J100 simulation configuration.
# Based on the Clearpath ROS 2 Humble j100_sample.yaml distributed with
# clearpath_config 1.3.3 (BSD-3-Clause).

serial_number: j100-0000
version: 0

system:
  hosts:
    - hostname: cpr-j100-0000
      ip: 192.168.131.1
  ros2:
    namespace: j100_0000

platform:
  attachments:
    - name: front_fender
      type: j100.fender
    - name: rear_fender
      type: j100.fender
      rpy: [0.0, 0.0, 3.1415]

links:
  cylinder:
    - name: sensor_mast
      parent: default_mount
      xyz: [0.0, 0.0, 0.10]
      rpy: [0.0, 0.0, 0.0]
      radius: 0.03
      length: 0.20

mounts:
  bracket:
    - parent: front_0_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      model: horizontal
    - parent: rear_0_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      model: horizontal

sensors:
  camera:
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      parent: default_mount
      xyz: [0.16, 0.0, 0.20]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        # Jazzy clearpath_config keys (the Humble-era camera.* names are ignored).
        intel_realsense:
          camera_name: camera_0
          device_type: d435
          serial_no: "0"
          enable_color: true
          # 424x240 at 6 Hz: enough for Nav2 obstacle detection on three robots.
          rgb_camera.color_profile: 424,240,6
          enable_depth: true
          depth_module.depth_profile: 424,240,6
          pointcloud.enable: true
  lidar2d:
    - model: hokuyo_ust
      urdf_enabled: true
      launch_enabled: true
      parent: bracket_0_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        urg_node:
          laser_frame_id: lidar2d_0_laser
          ip_address: 192.168.131.20
          ip_port: 10940
          angle_min: -3.141592653589793
          angle_max: 3.141592653589793
